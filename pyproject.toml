[project]
name = "glpi-ai-connector"
version = "0.1.0"
description = "Secure connector layer between GLPI and AI agents, with MCP as the first adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
glpi-ai-mcp = "glpi_ai_connector.adapters.mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glpi_ai_connector"]
